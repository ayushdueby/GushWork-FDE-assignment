<text x="40.0" y="159.0" font-size="13" fill="#5c6372">1. IT COMES IN</text>
<rect x="40.0" y="180.0" width="210.0" height="82.8" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="54.0" y="207.0" font-size="15" fill="#1e1e1e">Phone call</text>
<text x="54.0" y="226.8" font-size="12" fill="#5c6372">office line rings</text>
<text x="54.0" y="241.8" font-size="12" fill="#5c6372">her cell</text>
<rect x="40.0" y="290.0" width="210.0" height="82.8" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="54.0" y="317.0" font-size="15" fill="#1e1e1e">Text message</text>
<text x="54.0" y="336.8" font-size="12" fill="#5c6372">repeat customers,</text>
<text x="54.0" y="351.8" font-size="12" fill="#5c6372">referrals</text>
<rect x="40.0" y="400.0" width="210.0" height="82.8" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="54.0" y="427.0" font-size="15" fill="#1e1e1e">Website form</text>
<text x="54.0" y="446.8" font-size="12" fill="#5c6372">goes to an</text>
<text x="54.0" y="461.8" font-size="12" fill="#5c6372">email inbox</text>
<rect x="40.0" y="510.0" width="210.0" height="67.8" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="54.0" y="537.0" font-size="15" fill="#1e1e1e">Email</text>
<text x="54.0" y="556.8" font-size="12" fill="#5c6372">service@ inbox</text>
