<text x="54.0" y="632.0" font-size="15" fill="#1e1e1e">Her notebook</text>
<text x="54.0" y="651.8" font-size="12" fill="#5c6372">typed in by hand</text>
<text x="330.0" y="159.0" font-size="13" fill="#5c6372">2. ENTRY POINT</text>
<rect x="330.0" y="180.0" width="250.0" height="82.8" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="344.0" y="207.0" font-size="15" fill="#1e1e1e">/dialer</text>
<text x="344.0" y="226.8" font-size="12" fill="#5c6372">inbound ring UI,</text>
<text x="344.0" y="241.8" font-size="12" fill="#5c6372">missed call -&gt; lead</text>
<rect x="330.0" y="290.0" width="250.0" height="67.8" rx="8" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="344.0" y="317.0" font-size="15" fill="#1e1e1e">POST /api/webhooks</text>
<text x="344.0" y="336.8" font-size="12" fill="#5c6372">twilio/sms  (signed)</text>
<rect x="330.0" y="385.0" width="250.0" height="82.8" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="344.0" y="412.0" font-size="15" fill="#1e1e1e">/request</text>
<text x="344.0" y="431.8" font-size="12" fill="#5c6372">public page -&gt;</text>
<text x="344.0" y="446.8" font-size="12" fill="#5c6372">POST /api/public/request</text>
<rect x="330.0" y="495.0" width="250.0" height="67.8" rx="8" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="344.0" y="522.0" font-size="15" fill="#1e1e1e">GET /api/gmail/sync</text>
<text x="344.0" y="541.8" font-size="12" fill="#5c6372">OAuth mailbox pull</text>
<rect x="330.0" y="590.0" width="250.0" height="82.8" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="344.0" y="617.0" font-size="15" fill="#1e1e1e">/jobs/new</text>
<text x="344.0" y="636.8" font-size="12" fill="#5c6372">paste a message,</text>
<text x="344.0" y="651.8" font-size="12" fill="#5c6372">parser fills the form</text>
