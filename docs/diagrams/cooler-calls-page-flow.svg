<text x="54.0" y="767.0" font-size="15" fill="#1e1e1e">The two-minute demo</text>
<text x="54.0" y="786.8" font-size="12" fill="#5c6372">1  email lands in the Inbox, becomes an urgent lead</text>
<text x="54.0" y="801.8" font-size="12" fill="#5c6372">2  pipeline writes customer + job + activity</text>
<text x="54.0" y="816.8" font-size="12" fill="#5c6372">3  it is top of Today, in red, with a suggested next step</text>
<text x="54.0" y="831.8" font-size="12" fill="#5c6372">4  Call from the row -&gt; dialer -&gt; transcript -&gt; apply the diff</text>
<text x="54.0" y="846.8" font-size="12" fill="#5c6372">5  build the quote on the job, send it</text>
<text x="54.0" y="861.8" font-size="12" fill="#5c6372">6  customer accepts at the public link -&gt; job approved</text>
<text x="54.0" y="876.8" font-size="12" fill="#5c6372">7  drag it onto a tech's slot on the schedule</text>
<text x="54.0" y="891.8" font-size="12" fill="#5c6372">8  tech marks it done from the phone</text>
<text x="54.0" y="906.8" font-size="12" fill="#5c6372">9  reports and the week's revenue move</text>
