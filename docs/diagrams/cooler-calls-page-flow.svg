<text x="660.0" y="159.0" font-size="13" fill="#5c6372">3. ONE PIPELINE</text>
<rect x="660.0" y="240.0" width="290.0" height="202.8" rx="8" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="674.0" y="267.0" font-size="15" fill="#1e1e1e">ingestMessage()</text>
<text x="674.0" y="286.8" font-size="12" fill="#5c6372">1  store the raw message</text>
<text x="674.0" y="301.8" font-size="12" fill="#5c6372">2  extract  (Groq -&gt; zod)</text>
<text x="674.0" y="316.8" font-size="12" fill="#5c6372">   fallback: rule parser</text>
<text x="674.0" y="331.8" font-size="12" fill="#5c6372">3  match customer</text>
<text x="674.0" y="346.8" font-size="12" fill="#5c6372">   phone / email / fuzzy name</text>
<text x="674.0" y="361.8" font-size="12" fill="#5c6372">4  create job  or attach</text>
<text x="674.0" y="376.8" font-size="12" fill="#5c6372">5  apply intent</text>
<text x="674.0" y="391.8" font-size="12" fill="#5c6372">   yes -&gt; approved</text>
<text x="674.0" y="406.8" font-size="12" fill="#5c6372">   no  -&gt; lost</text>
<text x="674.0" y="421.8" font-size="12" fill="#5c6372">6  write Activity</text>
<rect x="660.0" y="510.0" width="290.0" height="97.8" rx="8" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="674.0" y="537.0" font-size="15" fill="#1e1e1e">call pipeline</text>
<text x="674.0" y="556.8" font-size="12" fill="#5c6372">record mic -&gt; Whisper</text>
<text x="674.0" y="571.8" font-size="12" fill="#5c6372">-&gt; extract -&gt; field diff</text>
<text x="674.0" y="586.8" font-size="12" fill="#5c6372">-&gt; apply to the job</text>
